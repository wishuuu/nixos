; Laptop loki, Realtek ALC256: analogowy mikrofon na pinie 0x1b.
; Internal Mic (0x13) nie jest podłączony. Internal Mic 1 jest właściwym wejściem.
[General]
priority = 89
description-key = analog-input-microphone-internal

[Element Capture]
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

[Element Internal Mic]
switch = off

[Element Internal Mic Boost]
volume = off

[Element Headset Mic]
switch = off

[Element Internal Mic 1]
required = any
switch = mute

[Element Internal Mic Boost,1]
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
